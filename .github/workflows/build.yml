name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Create Standard Flutter Project
        run: |
          flutter create --org com.example --project-name mm_banking_vpn temp_app
          cp pubspec.yaml temp_app/
          cp lib/main.dart temp_app/lib/
          cd temp_app
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd temp_app
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MM-Banking-VPN-APK
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
